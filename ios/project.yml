name: Networth
options:
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '27.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    NETWORTH_BUNDLE_ID: com.example.networth
    NETWORTH_APP_GROUP: group.$(NETWORTH_BUNDLE_ID)
  configs:
    debug:
      ONLY_ACTIVE_ARCH: YES
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: '-Onone'
targets:
  Networth:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: NetworthWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NETWORTH_BUNDLE_ID)
        PRODUCT_NAME: Networth
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: '1,2'
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NetworthAppGroup: $(NETWORTH_APP_GROUP)
        CFBundleURLTypes:
          - CFBundleURLName: Networth
            CFBundleURLSchemes: [networth]
    entitlements:
      path: App/Networth.entitlements
      properties:
        com.apple.security.application-groups: [$(NETWORTH_APP_GROUP)]
  NetworthWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NETWORTH_BUNDLE_ID).widgets
        PRODUCT_NAME: NetworthWidgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        NetworthAppGroup: $(NETWORTH_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/NetworthWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(NETWORTH_APP_GROUP)]
  NetworthTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(NETWORTH_BUNDLE_ID).tests
    dependencies:
      - target: Networth
schemes:
  Networth:
    build:
      targets:
        Networth: all
        NetworthTests: [test]
    test:
      targets: [NetworthTests]
