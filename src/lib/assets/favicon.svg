<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<!-- networth: stacked account bands climbing under a dollar mark.
	     Self-contained tile (no prefers-color-scheme): the same artwork is the
	     browser tab icon and, rendered full-bleed by scripts/generate-icons.sh,
	     the homescreen icon. Square by design - the bands bleed to the edge and
	     iOS masks its own corners. -->
	<rect width="64" height="64" fill="#18181b" />
	<path fill="#eb6834" d="M0 64 L0 46 L16 47 L32 42 L48 43 L64 33 L64 64 Z" />
	<path fill="#2a78d6" d="M0 46 L0 36 L16 37 L32 30 L48 31 L64 19 L64 33 L48 43 L32 42 L16 47 Z" />
	<text
		x="7"
		y="30"
		fill="#fafafa"
		font-family="system-ui, -apple-system, Helvetica, sans-serif"
		font-size="30"
		font-weight="800">$</text
	>
</svg>
