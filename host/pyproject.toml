[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "networth-host"
version = "0.1.0"
description = "Outbound Networth host protocol and recovery journal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["keyring>=25,<26"]

[project.scripts]
networth-host = "networth_host.__main__:main"

[tool.setuptools.packages.find]
include = ["networth_host*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
