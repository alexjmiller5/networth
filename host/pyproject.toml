[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "networth-host"
version = "0.1.0"
description = "Picks up Networth finance review runs and launches an agent for each in Herdr"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
networth-host = "networth_host.cli:main"

[tool.setuptools.packages.find]
include = ["networth_host*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
